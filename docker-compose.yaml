  ganache-smart-contract:
    image: node:18
    container_name: ganache-smart-contract
    working_dir: /usr/src/app
    volumes:
      - ./blockchain:/usr/src/app
    command: >
      sh -c "npx hardhat run scripts/deploy.js --network ganache-node"
    depends_on:
      ganache-node:
        condition: service_healthy
    networks:
      - eth-network

  ganache-node:
    container_name: ganache-node
    platform: linux/amd64
    build:
      context: ./blockchain
      dockerfile: Dockerfile.ganache
    volumes:
      - ./.ganache-db:/data
    ports:
      - "8545:8545"
    command: >
      --db /data
      --deterministic
      --mnemonic "candy maple cake sugar pudding cream honey rich smooth crumble sweet treat"
      --networkId 1337
      --defaultBalanceEther 10000
    networks:
      - eth-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8545"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ENV_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ENV_MINIO_SECRET_KEY:-minioadmin}
    command: server --console-address ":9001" /data
    volumes:
      - .minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - eth-network

  minio-create-bucket:
    image: minio/mc
    container_name: minio-create-bucket
    entrypoint: >
      /bin/sh -c "
        until (mc alias set minio http://minio:9000 ${MINIO_ENV_MINIO_ACCESS_KEY:-minioadmin} ${MINIO_ENV_MINIO_SECRET_KEY:-minioadmin}) do
          echo 'Waiting for Minio to start...' && sleep 1;
        done;
        if ! mc ls minio/${MINIO_BUCKET:-iot-data} > /dev/null 2>&1; then
          mc mb minio/${MINIO_BUCKET:-iot-data}
        else
          echo 'Bucket already exists.'
        fi
        "
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - eth-network

  persistence-worker:
    build: ./persistence-worker
    container_name: persistence-worker
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ENV_MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ENV_MINIO_SECRET_KEY:-minioadmin}
      AWS_REGION: us-east-1
      AWS_BUCKET_NAME: ${MINIO_BUCKET:-iot-data}
      AWS_S3_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      #BLOCKCHAIN_NODE: http://hardhat-node:8545
      BLOCKCHAIN_NODE: http://ganache-node:8545
      MQTT_BROKER: mosquitto-service
      MQTT_PORT: 1883
      MQTT_TOPIC: iot_data
      BLOCKCHAIN_CONTRACT_ADDRESS: 0x8CdaF0CD259887258Bc13a92C0a6dA92698644C0  # Ganache test contract address
      RUNNING_IN_DOCKER: 1
    restart: always
    depends_on:
      minio:
        condition: service_healthy
      ganache-node:
        condition: service_healthy
      # hardhat-node:
      #   condition: service_healthy
      mosquitto-service:
        condition: service_started
    networks:
      - eth-network

  delta-reader:
    build: ./delta-reader
    container_name: delta-reader
    environment:
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ENV_MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ENV_MINIO_SECRET_KEY:-minioadmin}
      AWS_REGION: us-east-1
      AWS_BUCKET_NAME: ${MINIO_BUCKET:-iot-data}
      AWS_S3_SECURE: false
    restart: always
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://delta-reader:8005/health"]
      interval: 30s
      timeout: 20s
      retries: 3
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - eth-network

  app-postgres:
    image: postgres:17.5-alpine3.22
    container_name: app-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_password}
      POSTGRES_DB: ${POSTGRES_DB:-iot_db}
    volumes:
      - ./.app-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot_user} -d ${POSTGRES_DB:-iot_db}"]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "5432:5432"
    networks:
      - eth-network

  back-api:
    build: ./back-api
    container_name: back-api
    environment:
      DB_URL: postgresql+psycopg://${POSTGRES_USER:-iot_user}:${POSTGRES_PASSWORD:-iot_password}@app-postgres:5432/${POSTGRES_DB:-iot_db}
      SECRET_KEY: "job_board_app_secret!"
      ALGORITHM: "HS256"
      TOKEN_EXPIRATION_TIME_MINUTES: 15
      DEVICE_DATA_SERVICE_URL: http://delta-reader:8005
    restart: always
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://back-api:8000/health"]
      interval: 30s
      timeout: 20s
      retries: 3
    depends_on:
      app-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ganache-node:
        condition: service_healthy
      # hardhat-node:
      #   condition: service_healthy
      mosquitto-service:
        condition: service_started
      delta-reader:
        condition: service_healthy
    networks:
      - eth-network

  front-end:
    build: ./iot-chain-front
    container_name: iot-chain-front
    environment:
      APP_BACKEND_URL: http://back-api:8000
      NODE_ENV: production
    restart: always
    ports:
      - "4200:80"
    depends_on:
      back-api:
        condition: service_healthy
    networks:
      - eth-network

# Manually start services with `docker compose --profile=manual up <service-name>`
# to avoid starting them with `docker compose up`.
# This is useful for services that are not needed for the main application to run.

# Explore the blockchain data
  expedition:
    image: etclabscore/expedition:latest
    profiles:
      - manual
    container_name: expedition
    ports:
      - "3001:80"
    depends_on:
      hardhat-node:
        condition: service_healthy
    environment:
      - REACT_APP_ETH_RPC_URL=http://localhost:8545
    networks:
      - eth-network

# Explore the MQTT data
  mqtt-explorer:
    image: smeagolworms4/mqtt-explorer:latest
    profiles:
      - manual
    container_name: mqtt-explorer
    restart: always
    ports:
      - '8080:4000'

# The MinIO Mirror service make a local copy of the data stored in the MinIO bucket.
# The data is stored in the 'minio-mirror' directory.
  minio-mirror:
    image: minio/mc
    profiles:
      - manual
    container_name: minio-mirror
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for MinIO to be available...' &&
        until (mc alias set minio http://minio:9000 ${MINIO_ENV_MINIO_ACCESS_KEY:-minioadmin} ${MINIO_ENV_MINIO_SECRET_KEY:-minioadmin}); do
          sleep 2;
        done;
        mkdir -p /data/mirror &&
        mc mirror --watch --overwrite minio/iot-data /data/mirror
      "
    volumes:
      - ./minio-mirror:/data/mirror
    restart: no
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - eth-network

# The DuckDB container is started with an interactive shell, so you can run DuckDB commands directly in the container.
# To start to work with examne the data in the 'minio-mirror' directory, you need to run the nimio-mirror service first.
# To runt nimio-mirror service, you need to run the `docker compose -f docker-compose.yaml up minio-mirror` command.
# To start the DuckDB container, run `docker compose -f docker-compose.duckdb.yaml up -d`.
# To enter the DuckDB container, run `docker exec -it duckdb /bin/bash`.
# To start the DuckDB shell, run `duckdb`.
# Example queries:
#   - SELECT * FROM parquet_scan('/data/iot-data/*.parquet');
#   - SELECT device_id, CAST(data['temp'][1] AS INTEGER) AS temperature, strftime(TO_TIMESTAMP(CAST(timestamp AS BIGINT)), '%d/%m/%Y %H:%M:%S') AS formatted_ts FROM parquet_scan('/data/iot-data/*.parquet');
  duckdb:
    image: qldrsc/duckdb
    profiles:
      - manual
    container_name: duckdb
    entrypoint: /bin/sh
    stdin_open: true
    tty: true
    working_dir: /data
    volumes:
      - ./minio-mirror:/data

networks:
  eth-network:
    driver: bridge
